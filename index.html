<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldstats - Em Breve</title>
    <link rel="stylesheet" href="src/css/style.css">
    
    <link rel="icon" href="src/img/icon.png" type="image/png">   
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif+TC:wght@200..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="video-container">
        <!-- O atributo 'playsinline' é crucial para reprodução automática no iOS -->
        <video autoplay loop muted playsinline class="bg-video">
            <source src="src/video/video.mp4" type="video/mp4">
            Seu navegador não suporta vídeos HTML5.
        </video>
        <div class="overlay"></div>
    </div>

    <!-- Conteúdo Central -->
    <div class="content">
        <img src="src/img/logo.png" alt="Logo Field Stats" class="logo">
    
        <!-- Badge de Lançamento -->
        <div class="release-badge">
            <i class="fa-solid fa-futbol"></i> Lançamento no 2º semestre de 2026
        </div>
    
        <h1>O caminho da vitória começa aqui.</h1>
        <p>O seu software de analise de desempenho esta se preparando para entrar em campo, fique ligado para as novidades
            em breve.</p>
    
        <!-- Botão do Instagram -->
        <a href="https://instagram.com/SEU_USUARIO" target="_blank" class="btn-instagram">
            <i class="fa-brands fa-instagram"></i>
            Acompanhe o aquecimento no Instagram
        </a>
    
        <!-- Copyright no Rodapé -->
        <div class="copyright">
            &copy; 2026 FieldStats. Todos os direitos reservados.
        </div>
    </div>
    
</body>
</html>
